<VirtualHost *:80>
    ServerName portal.local
    DocumentRoot /var/www/onboarding-portal/public

    <Directory /var/www/onboarding-portal/public>
        # AllowOverride All is required so that Laravel's .htaccess can
        # redirect all requests through index.php via mod_rewrite.
        # Without this, every route except / returns 404.
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/onboarding_error.log
    CustomLog ${APACHE_LOG_DIR}/onboarding_access.log combined
</VirtualHost>
